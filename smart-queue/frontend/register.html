<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Queue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <a class="brand-link" href="index.html">Smart Queue</a>
        <p class="eyebrow">Get started</p>
        <h1>Create account</h1>
        <p class="muted">Register as a user to join a virtual queue.</p>
        <div id="register-message" class="message" role="status" aria-live="polite"></div>
        <form id="register-form" class="stack-form">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <button class="button primary" type="submit">Register</button>
        </form>
        <p class="form-footer">Already registered? <a href="login.html">Login</a></p>
    </section>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
