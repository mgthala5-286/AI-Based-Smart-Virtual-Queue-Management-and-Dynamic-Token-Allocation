<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Queue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <a class="brand-link" href="index.html">Smart Queue</a>
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>
        <p class="muted">Enter your account details to continue.</p>
        <div id="login-message" class="message" role="status" aria-live="polite"></div>
        <form id="login-form" class="stack-form">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="button primary" type="submit">Login</button>
        </form>
        <p class="form-footer">New here? <a href="register.html">Create an account</a></p>
    </section>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
