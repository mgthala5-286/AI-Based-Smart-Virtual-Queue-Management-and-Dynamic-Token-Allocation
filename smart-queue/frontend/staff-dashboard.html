<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard | Smart Queue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <a class="brand-link" href="staff-dashboard.html">Smart Queue</a>
    <div class="header-actions">
        <span id="header-user-name" class="user-label"></span>
        <button id="logout-button" class="button ghost" type="button">Logout</button>
    </div>
</header>
<main class="page-shell">
    <div id="staff-message" class="message" role="status" aria-live="polite"></div>
    <section class="section-heading">
        <div>
            <p class="eyebrow">Operations view</p>
            <h1>Staff dashboard</h1>
        </div>
        <span class="live-pill"><span class="live-dot"></span> Read-only live queue</span>
    </section>
    <section class="panel">
        <div class="section-title-row">
            <div>
                <p class="eyebrow">Service queue</p>
                <h2>Current queue</h2>
            </div>
            <label class="compact-label" for="staff-service-select">Service
                <select id="staff-service-select"></select>
            </label>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Token</th><th>Position</th><th>Status</th><th>Estimated wait</th></tr></thead>
                <tbody id="staff-queue-body"></tbody>
            </table>
        </div>
        <div id="staff-queue-empty" class="empty-table">Select a service to view its queue.</div>
    </section>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
