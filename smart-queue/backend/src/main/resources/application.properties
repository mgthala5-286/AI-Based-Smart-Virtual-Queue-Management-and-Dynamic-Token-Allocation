spring.application.name=smart-queue

# This path is relative to the backend directory when running with Maven.
smart-queue.database-path=../data/

server.port=8080

# Development-only JWT settings. Change the secret outside local development.
smart-queue.jwt-secret=smart-queue-development-secret-key-change-this-value
smart-queue.jwt-expiration-ms=3600000
smart-queue.demo-accounts.enabled=true

# Phase 8 ML waiting-time prediction service.
ml.service.url=http://localhost:8000
ml.service.connect-timeout=2000
ml.service.read-timeout=3000
ml.service.enabled=true
